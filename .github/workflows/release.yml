name: Release

# GeoThai/source pushes a tag vYYYY.M.D with each data update.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun run check
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npx changelogithub@15.0.5
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Attach the data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip -qr geothai-json.zip json datapackage.json LICENSE NOTICE
          zip -qr geothai-csv.zip csv datapackage.json LICENSE NOTICE
          gh release upload "${{ github.ref_name }}" geothai-json.zip geothai-csv.zip
