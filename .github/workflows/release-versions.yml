name: 📦 Create Version Releases

on:
  # Manually trigger the workflow
  workflow_dispatch:

  # Or automatically on push to main branch
  push:
    branches:
      - main
    paths:
      - 'data/**'

permissions:
  contents: write

jobs:
  create-releases:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Fetch all history to properly identify changes

      - name: ⚙️ Set up Git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      - name: 📂 Get version directories
        id: get-versions
        run: |
          cd data
          VERSIONS=$(ls -d v* | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "versions=$VERSIONS" >> $GITHUB_OUTPUT

      - name: 🚀 Create and publish releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSIONS='${{ steps.get-versions.outputs.versions }}'

          for VERSION in $(echo "${VERSIONS}" | jq -r '.[]'); do
            echo "Processing version: $VERSION"
            
            # Check if release already exists
            if ! gh release view $VERSION &>/dev/null; then
              echo "Creating new release for $VERSION"
              
              # Create zip file for this version
              ZIP_FILE="${VERSION}.zip"
              cd data
              zip -r "../$ZIP_FILE" "$VERSION"
              cd ..
              
              # Create release with the zip file
              NOTES="Release of data version $VERSION"
              
              # If there's a README.md in the version directory, use it as release notes
              if [ -f "data/$VERSION/README.md" ]; then
                NOTES=$(cat "data/$VERSION/README.md")
              fi
              
              # Create a tag for this version if it doesn't exist
              if ! git ls-remote --tags origin | grep -q "refs/tags/$VERSION"; then
                git tag "$VERSION"
                git push origin "$VERSION"
              fi
              
              # Create GitHub release
              gh release create "$VERSION" \
                --title "Data $VERSION" \
                --notes "$NOTES" \
                "$ZIP_FILE"
                
              echo "Created release for $VERSION"
            else
              echo "Release $VERSION already exists, skipping"
            fi
          done
